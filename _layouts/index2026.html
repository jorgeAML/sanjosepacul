<!DOCTYPE html>
<html lang="es">
    <head>
        <title>{{page.title}}</title>
        <meta property="og:title" content="{{page.meta-title}}"/>
        <meta property="og:description" content="{{page.meta-description}}"/>
        <meta name="title" content="{{page.meta-title}}"/>
        <meta name="description" content="{{page.meta-description}}"/>
        <meta name="copyright" content="{{page.meta-copyright}}"/>
        <meta name="keywords" content="{{page.meta-keywords}}"/>
        <meta property="og:type" content="{{page.meta-type}}"/>
        <meta property="og:url"content="{{page.meta-url}}"/>
        {% include head.html %}
    </head>
    <body>
        {% include navIndex.html %}
        <header>
            <div class="header-container">
                <div class="row-header">
                    <div class="column-6">
                        <img src="{{page.header-image1}}" alt="page.alt-image1" class="img-header">
                        <div class="header-text">
                            <h1>{{page.header-card-img-title}}</h1>
                            <p>{{page.header-card-img-subtitle}}</p>
                        </div>
                    </div>
                    <div class="column-6">
                        <img src="{{page.header-image2}}" alt="page.alt-image2" class="img-header">
                        <div class="header-text">
                            <h1>{{page.header-card-img2-title}}</h1>
                            <p>{{page.header-card-img2-subtitle}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        
        {{ content }}
    </body>
</html>
